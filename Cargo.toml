[package]
name = "lilaccaps"
version = "0.1.4"
description = "Rust CLI for transcribing media and burning subtitles into video"
edition = "2024"
license = "MIT"
repository = "https://github.com/zhuisDEV/lilaccaps"
homepage = "https://github.com/zhuisDEV/lilaccaps"
readme = "README.md"
keywords = ["subtitles", "captions", "video", "ffmpeg", "whisper"]
categories = ["command-line-utilities", "multimedia::video"]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
dirs = "6.0.0"
hound = "3.5.1"
num_cpus = "1.17.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"
whisper-rs = "0.16.0"
