[package]
name = "lilaccaps"
version = "0.1.16"
description = "Rust CLI for transcribing media, burning subtitles, and watermarking video"
edition = "2024"
license = "MIT"
repository = "https://github.com/zhuisDEV/lilaccaps"
homepage = "https://github.com/zhuisDEV/lilaccaps"
readme = "README.md"
keywords = ["subtitles", "captions", "watermark", "ffmpeg", "whisper"]
categories = ["command-line-utilities", "multimedia::video"]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
dirs = "6.0.0"
hound = "3.5.1"
num_cpus = "1.17.0"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.2"
whisper-rs = "0.16.0"
dotenvy = "0.15.7"
