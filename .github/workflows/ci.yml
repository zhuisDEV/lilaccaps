name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          components: clippy, rustfmt

      - name: Install system dependencies
        run: |
          brew install ffmpeg-full cmake imagemagick shellcheck actionlint gitleaks cargo-audit uv
          if brew list --versions ffmpeg >/dev/null 2>&1; then
            brew unlink ffmpeg
          fi
          brew link --overwrite --force ffmpeg-full

      - name: Format check
        run: |
          cargo fmt --all --check
          uvx ruff format --check python

      - name: Python helper checks
        run: |
          uvx ruff check python
          uvx ty check python
          uv run --script python/faster_whisper_helper.py --audio python/faster_whisper_helper.py --model large-v3-turbo --download-root "${RUNNER_TEMP}/lilaccaps-model-check" --check

      - name: Installer checks
        run: |
          sh -n install.sh
          shellcheck install.sh

      - name: Workflow check
        run: actionlint

      - name: Secret scan
        run: gitleaks detect --source . --no-banner --redact

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features --locked

      - name: Security audit
        run: cargo audit

  test-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          components: clippy, rustfmt

      - name: Install Linux media and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang cmake libclang-dev pkg-config \
            ffmpeg fontconfig fonts-dejavu-core fonts-noto-cjk python3 curl

      - name: Install pinned ImageMagick 7 for this job
        env:
          # Digest verified against the immutable upstream release asset metadata:
          # https://api.github.com/repos/ImageMagick/ImageMagick/releases/tags/7.1.2-31
          MAGICK_ASSET_URL: https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-31/ImageMagick-7.1.2-31-gcc-x86_64.AppImage
          MAGICK_ASSET_SHA256: b22dee096a68e7eb6771a6f98c16490ea78d399ffa27f34ca2ec4f02e707fd9c
        run: |
          dependency_root="${RUNNER_TEMP}/lilaccaps-media-tools"
          mkdir -p "${dependency_root}/imagemagick" "${dependency_root}/bin"
          cd "${dependency_root}/imagemagick"
          curl --fail --location --retry 3 --output ImageMagick.AppImage "${MAGICK_ASSET_URL}"
          printf '%s  %s\n' "${MAGICK_ASSET_SHA256}" ImageMagick.AppImage | sha256sum --check --strict
          chmod +x ImageMagick.AppImage
          # Extract the genuine v7 runtime; no FUSE mount or system installation is needed.
          ./ImageMagick.AppImage --appimage-extract > "${dependency_root}/imagemagick-extract.log"
          ln -s "${dependency_root}/imagemagick/squashfs-root/AppRun" "${dependency_root}/bin/magick"
          printf '%s\n' "${dependency_root}/bin" >> "${GITHUB_PATH}"

      - name: Check Linux rendering dependencies
        run: |
          magick --version
          ffmpeg -version
          ffprobe -version
          fc-match --format '%{file}\n' 'sans-serif:lang=zh-cn'

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Rust and real media tests
        run: cargo test --all-targets --all-features --locked
