name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          components: clippy, rustfmt

      - name: Install system dependencies
        run: |
          brew install ffmpeg-full cmake imagemagick shellcheck actionlint gitleaks cargo-audit uv
          if brew list --versions ffmpeg >/dev/null 2>&1; then
            brew unlink ffmpeg
          fi
          brew link --overwrite --force ffmpeg-full

      - name: Format check
        run: |
          cargo fmt --all --check
          uvx ruff format --check python

      - name: Python helper checks
        run: |
          uvx ruff check python
          uvx ty check python
          uv run --script python/faster_whisper_helper.py --audio python/faster_whisper_helper.py --model large-v3-turbo --download-root "${RUNNER_TEMP}/lilaccaps-model-check" --check

      - name: Installer checks
        run: |
          sh -n install.sh
          shellcheck install.sh

      - name: Workflow check
        run: actionlint

      - name: Secret scan
        run: gitleaks detect --source . --no-banner --redact

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features --locked

      - name: Security audit
        run: cargo audit
